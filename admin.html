<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookOS — Owner Dashboard</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fixes.css">
<style>
  .admin-page{min-height:100vh;background:#fafafa;padding:42px 20px 90px}
  .admin-wrap{width:min(1120px,100%);margin:0 auto}
  .admin-top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:30px}
  .admin-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#888;font-weight:800;margin-bottom:9px}
  .admin-title{font-size:clamp(38px,6vw,64px);line-height:.95;letter-spacing:-.06em;margin:0}
  .admin-sub{color:#666;margin:12px 0 0;line-height:1.55}
  .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
  .admin-btn{border:1px solid #ddd;background:#fff;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
  .admin-btn.primary{background:#111;color:#fff;border-color:#111}
  .admin-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .admin-stat{background:#fff;border:1px solid #e7e7e7;border-radius:20px;padding:20px;box-shadow:0 8px 26px rgba(0,0,0,.035)}
  .admin-stat-label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
  .admin-stat-value{font-size:38px;font-weight:850;letter-spacing:-.06em;margin-top:9px;line-height:1}
  .admin-stat-note{font-size:12px;color:#777;margin-top:8px;line-height:1.4}
  .admin-panel{overflow:hidden;background:#fff;border:1px solid #e7e7e7;border-radius:22px;box-shadow:0 8px 26px rgba(0,0,0,.035);margin-bottom:18px}
  .admin-panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:21px 22px;border-bottom:1px solid #eee}
  .admin-panel-head h2{margin:0;font-size:20px;letter-spacing:-.03em}
  .admin-panel-head span{font-size:12px;color:#888}
  .admin-table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:760px}
  th,td{text-align:left;padding:15px 18px;border-bottom:1px solid #eee;vertical-align:top}
  th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#777;background:#fafafa}
  td{font-size:13px;line-height:1.5}
  td.email{font-weight:750;white-space:nowrap}
  .plan-pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#f2f2f2;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  td.feedback{max-width:500px;color:#555;white-space:pre-wrap}
  .admin-empty,.admin-error,.admin-loading{padding:38px 22px;text-align:center;color:#666}
  .admin-error{color:#a11}
  .admin-note{font-size:12px;color:#777;line-height:1.5}
  .billing-note{padding:16px 22px;color:#666;font-size:12px;border-top:1px solid #eee;background:#fafafa}
  @media(max-width:900px){.admin-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:640px){.admin-page{padding:26px 14px 60px}.admin-top{align-items:flex-start;flex-direction:column}.admin-actions{width:100%}.admin-btn{flex:1}.admin-stats{grid-template-columns:1fr 1fr}.admin-stat{border-radius:17px;padding:17px}.admin-stat-value{font-size:32px}.admin-panel{border-radius:18px}.admin-panel-head{padding:18px}}
</style>
</head>
<body>
<main class="admin-page">
  <div class="admin-wrap">
    <header class="admin-top">
      <div>
        <div class="admin-kicker">Private · Owner only</div>
        <h1 class="admin-title">HookOS Admin.</h1>
        <p class="admin-sub" id="admin-user">Checking owner access…</p>
      </div>
      <div class="admin-actions">
        <button class="admin-btn" id="refresh-btn" type="button">Refresh</button>
        <button class="admin-btn primary" id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <section class="admin-stats" aria-label="HookOS statistics">
      <article class="admin-stat"><div class="admin-stat-label">Accounts</div><div class="admin-stat-value" id="stat-users">—</div><div class="admin-stat-note">Registered Google accounts</div></article>
      <article class="admin-stat"><div class="admin-stat-label">Total generations</div><div class="admin-stat-value" id="stat-generations">—</div><div class="admin-stat-note">Successful blueprints</div></article>
      <article class="admin-stat"><div class="admin-stat-label">Today</div><div class="admin-stat-value" id="stat-today">—</div><div class="admin-stat-note">Generations today</div></article>
      <article class="admin-stat"><div class="admin-stat-label">AI cost</div><div class="admin-stat-value" id="stat-cost">—</div><div class="admin-stat-note" id="stat-cost-note">Tracked provider usage</div></article>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head"><h2>Accounts</h2><span id="users-updated"></span></div>
      <div id="users-content" class="admin-loading">Loading accounts…</div>
    </section>

    <section class="admin-panel">
      <div class="admin-panel-head"><h2>Early access</h2><span id="last-updated"></span></div>
      <div id="admin-content" class="admin-loading">Loading…</div>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
