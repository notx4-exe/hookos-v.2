<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HookOS — Owner Dashboard</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="fixes.css">
<style>
  .admin-page{min-height:100vh;background:#fafafa;padding:40px 20px 80px}
  .admin-wrap{width:min(1100px,100%);margin:0 auto}
  .admin-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px}
  .admin-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#777;font-weight:800;margin-bottom:8px}
  .admin-title{font-size:clamp(34px,6vw,58px);line-height:.98;letter-spacing:-.055em;margin:0}
  .admin-sub{color:#666;margin:12px 0 0;line-height:1.6}
  .admin-actions{display:flex;gap:10px;flex-wrap:wrap}
  .admin-btn{border:1px solid #ddd;background:#fff;border-radius:999px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
  .admin-btn.primary{background:#111;color:#fff;border-color:#111}
  .admin-stat{background:#fff;border:1px solid #e7e7e7;border-radius:24px;padding:24px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.035)}
  .admin-stat-label{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
  .admin-stat-value{font-size:44px;font-weight:800;letter-spacing:-.05em;margin-top:8px}
  .admin-table-card{overflow:hidden;background:#fff;border:1px solid #e7e7e7;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.035)}
  .admin-table-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid #eee}
  .admin-table-head h2{margin:0;font-size:20px}
  .admin-table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse;min-width:680px}
  th,td{text-align:left;padding:16px 20px;border-bottom:1px solid #eee;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#777;background:#fafafa}
  td{font-size:14px;line-height:1.55}
  td.feedback{max-width:500px;color:#555;white-space:pre-wrap}
  td.email{font-weight:700;white-space:nowrap}
  .admin-empty,.admin-error,.admin-loading{padding:40px 24px;text-align:center;color:#666}
  .admin-error{color:#a11}
  .admin-note{font-size:12px;color:#777;margin-top:16px}
  @media(max-width:640px){.admin-page{padding:24px 14px 60px}.admin-top{align-items:flex-start;flex-direction:column}.admin-actions{width:100%}.admin-btn{flex:1}.admin-stat{border-radius:20px}.admin-table-card{border-radius:20px}}
</style>
</head>
<body>
<main class="admin-page">
  <div class="admin-wrap">
    <header class="admin-top">
      <div>
        <div class="admin-kicker">Private · Owner</div>
        <h1 class="admin-title">HookOS Dashboard.</h1>
        <p class="admin-sub" id="admin-user">Checking owner access…</p>
      </div>
      <div class="admin-actions">
        <button class="admin-btn" id="refresh-btn" type="button">Refresh</button>
        <button class="admin-btn primary" id="logout-btn" type="button">Log out</button>
      </div>
    </header>

    <section class="admin-stat">
      <div class="admin-stat-label">Early access signups</div>
      <div class="admin-stat-value" id="signup-total">—</div>
      <div class="admin-note">People who joined your early-access list. Feedback is shown below.</div>
    </section>

    <section class="admin-table-card">
      <div class="admin-table-head"><h2>Feedback inbox</h2><span id="last-updated"></span></div>
      <div id="admin-content" class="admin-loading">Loading…</div>
    </section>
  </div>
</main>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
